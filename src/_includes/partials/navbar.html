<div class="w-full lg:fixed lg:inset-y-0 lg:left-0 lg:w-60 lg:z-40">
    <nav class="flex items-center justify-center lg:justify-start lg:items-start lg:flex-col lg:h-full flex-wrap p-6 lg:py-9 lg:pl-9 lg:pr-6" x-data="{ isOpen: false }" @keydown.escape="isOpen = false"  @click.away="isOpen = false">
        <!--Logo / wordmark-->
        <div class="flex items-center lg:mb-10">
            {% if path == "home" %}
            <a href="/" class="wm text-black hover:text-red-500" aria-label="Yulia Katan — home">
                <span class="wm__icon">❦</span><span class="wm__text">Yulia&nbsp;Katan</span>
            </a>
            {% else %}
            <a href="/" class="text-black font-bold text-lg hover:text-red-500">
                ❦</a>
            {% endif %}
        </div>

        <!--Toggle button (hidden on large screens)-->
        <button @click="isOpen = !isOpen" type="button" class="ml-auto block lg:hidden px-2 text-primary-500 hover:text-primary-500 focus:outline-none focus:text-primary-500" :class="{ 'transition transform-180': isOpen }" aria-label="Menu">
            <svg class="h-6 w-6 fill-current" xmlns="http://www.w3.org/2000/svg" viewbox="0 0 24 24">
                <path x-show="isOpen" fill-rule="evenodd" clip-rule="evenodd" d="M18.278 16.864a1 1 0 0 1-1.414 1.414l-4.829-4.828-4.828 4.828a1 1 0 0 1-1.414-1.414l4.828-4.829-4.828-4.828a1 1 0 0 1 1.414-1.414l4.829 4.828 4.828-4.828a1 1 0 1 1 1.414 1.414l-4.828 4.829 4.828 4.828z"/>
                <path x-show="!isOpen" fill-rule="evenodd" d="M4 5h16a1 1 0 0 1 0 2H4a1 1 0 1 1 0-2zm0 6h16a1 1 0 0 1 0 2H4a1 1 0 0 1 0-2zm0 6h16a1 1 0 0 1 0 2H4a1 1 0 0 1 0-2z"/>
            </svg>
        </button>

        <!--Menu-->
        <div class="w-full flex-grow lg:flex lg:flex-col lg:items-start lg:w-auto text-center lg:text-left " :class="{ 'block shadow-3xl': isOpen, 'hidden': !isOpen }" x-show.transition="true">

            {% if navigation.items %}

                <ul class="pt-6 lg:pt-0 list-reset lg:flex lg:flex-col justify-end lg:justify-start flex-1 items-center lg:items-start">
                    {% for item in navigation.items %}
                        <li class="nav__item mr-3 lg:mr-0 lg:mb-1 lg:relative group">
                            <a @click="isOpen = false" class="text-ml inline-block text-gray-500 no-underline hover:text-indigo-500 py-2 px-4 lg:px-0" href="{{ item.url }}">{{ item.text }}</a>
                            {% if item.children %}
                                <ul class="list-reset text-center lg:text-left lg:absolute lg:top-full lg:left-0 lg:z-50 lg:bg-white lg:py-2 lg:pr-10 lg:min-w-[10rem] lg:opacity-0 lg:invisible lg:translate-y-1 lg:transition lg:duration-150 lg:ease-out lg:group-hover:opacity-100 lg:group-hover:visible lg:group-hover:translate-y-0">
                                    {% for child in item.children %}
                                        <li class="lg:mb-1">
                                            <a @click="isOpen = false" class="text-ml inline-block text-gray-400 no-underline hover:text-indigo-500 py-1 px-4 lg:px-0" href="{{ child.url }}">{{ child.text }}</a>
                                        </li>
                                    {% endfor %}
                                </ul>
                            {% endif %}
                        </li>
                    {% endfor %}
                </ul>

            {% endif %}
        </div>
    </nav>
</div>
