---
layout: default
title: Selected works
path: gallery
fullwidth: true
---

<div class="flex-1 flex flex-col lg:grid lg:grid-cols-12 lg:gap-x-[23px] lg:px-9 lg:content-start">
  <div class="px-6 lg:px-0 lg:col-start-3 lg:col-span-9">
  <h1 class="mt-7  mb-10">
    <strong class="">
      {{title}}
    </strong>
  </h1>

<div id="gallery"></div>

<script type="text/javascript">


const data = [
  {

    "group": {
      "title": "",
      "description": ""
    },
    "items": [


    ]
  }

];

let galleryHTML = '';

for (let group of data) {

  galleryHTML += `
    <h2 class="gallery__title">${group.group.title}</h2>
    <p class="gallery__description">${group.group.description}</p>
  `;

  for (let item of group.items) {

    galleryHTML += `
      <div class="gallery-item space-y-1 mb-12 reveal">
        <button type="button" class="zoom-trigger" data-zoom
          data-full="${item.imageSrc.replace('/thumb/', '/')}"
          data-title="${item.title || ''}"
          data-materials="${item.materials || ''}"
          data-measures="${item.measures || ''}"
          data-year="${item.year || ''}">
          <img src="${item.imageSrc}" alt="${item.imageAlt}" title="Yulia Katan. ${item.title}" loading="lazy" class="inset-0 mb-4 img-hover">
        </button>
        <h3 class="gallery-item gallery-item__title ml-10 mt-3 mb-1 mr-10 text-lg">${item.title}</h3>
        <p class="gallery-item__text ml-2 mr-2 sm:ml-10 sm:mr-10 mt-1">

          <span  class="gallery-item__materials text-sm text-slate-700">${item.materials}</span><br>`;
    if(item.measures!==undefined) galleryHTML += `<span  class="gallery-item__measures font-mono  text-xs text-slate-700" style="letter-spacing: .1rem">${item.measures}</span><br>`;
    galleryHTML += `<span class="gallery-item__year  text-xs font-mono tracking-wider text-slate-400 hover:text-slate-700" style="letter-spacing: .1rem">${item.year}</span><br>
        </p>
      </div>
    `;

  }

}

const gallery = document.getElementById('gallery');

gallery.innerHTML = galleryHTML;

// Init scroll reveal for dynamically added items
if (window.initReveal) window.initReveal();
</script>
  </div>




</div>
