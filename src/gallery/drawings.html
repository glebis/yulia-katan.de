<style>
  .draw-wall {
    position: relative;       /* positioning context for the absolutely-placed Ooze */
    display: grid;
    grid-template-columns: 1fr;
    gap: 48px 36px;
    align-items: start;       /* tops align, bottoms stay ragged — a free hang */
  }
  /* Full-width triptych row below the free hang: three equal squares.
     Stacks on mobile; three across from sm up. */
  .draw-row3 {
    display: grid;
    grid-template-columns: 1fr;
    gap: 48px 36px;
    margin-top: 48px;
  }
  /* Row of two equal-width landscape works. */
  .draw-row2 {
    display: grid;
    grid-template-columns: 1fr;
    gap: 48px 36px;
    margin-top: 48px;
  }
  /* Symmetric triptych, height matched to Perfectionism. Flex (not grid) so the
     items' percentage widths resolve against the wall, not a 1fr cell. */
  .draw-trip {
    display: flex;
    flex-direction: column;
    gap: 48px;
    margin-top: 48px;
  }
  /* A Secret paired with a vertical Hearing / Shedding stack. On mobile the
     stack drops below A Secret; on lg they sit side by side (see below). */
  .draw-secret { margin-top: 48px; }
  .draw-secret__stack { display: flex; flex-direction: column; gap: 48px; margin-top: 48px; }
  .draw-item {
    position: relative;
    display: block;
    padding: 0; border: 0; background: none;
    cursor: zoom-in;
  }
  .draw-item img { display: block; width: 100%; height: auto; }

  /* Wall label — sits in the whitespace below each work so it never covers the
     art or disturbs the ragged baseline. Uses the site's main font (inherited),
     15% smaller than before. Revealed on hover/focus; on touch the full caption
     lives in the lightbox. */
  .draw-cap {
    position: absolute;
    top: 100%; left: 0;
    margin-top: 12px;
    max-width: 22rem;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.2rem 0.7rem;
    font-family: inherit;
    font-size: 0.595rem;
    letter-spacing: 0.09rem;
    text-transform: uppercase;
    color: #1e1b19;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.35s var(--ease-out-quart), transform 0.35s var(--ease-out-quart);
    pointer-events: none;
  }
  .draw-cap__year { color: #94a3b8; letter-spacing: 0.12rem; }
  .draw-item:hover .draw-cap,
  .draw-item:focus-visible .draw-cap { opacity: 1; transform: translateY(0); }

  /* Keyboard focus: a quiet hairline frame offset off the work */
  .draw-item:focus { outline: none; }
  .draw-item:focus-visible { outline: 1px solid rgba(30, 27, 25, 0.45); outline-offset: 6px; }

  @media (prefers-reduced-motion: reduce) {
    .draw-cap { transition: none; transform: none; }
    .draw-item:hover .draw-cap,
    .draw-item:focus-visible .draw-cap { transform: none; }
  }

  @media (min-width: 640px) {
    .draw-wall { grid-template-columns: repeat(2, 1fr); column-gap: 56px; row-gap: 64px; }
    .draw-row3 { grid-template-columns: repeat(3, 1fr); gap: 56px; margin-top: 64px; }
    .draw-row2 { grid-template-columns: 1fr 1fr; gap: 56px; margin-top: 64px; }
    /* squares 20% smaller than the cell, but the outer two are pinned to the
       content field's edges (start / end) and the middle is centered — the row
       still spans the full width, the works just sit lighter with air between. */
    .draw-row3 .draw-item { width: 72%; }
    .draw-row3 .draw-item:first-child  { justify-self: start; }
    .draw-row3 .draw-item:nth-child(2) { justify-self: center; }
    .draw-row3 .draw-item:last-child   { justify-self: end; }
    .draw-item--wide { grid-column: span 2; }   /* Molt — wide feature */
    /* Clear Night — smaller, pushed to the right edge and dropped to the
       bottom line of its row (level with Upward Lament) */
    .draw-item--small { align-self: end; }
    .draw-item--small img { width: 64%; margin-left: auto; }
    /* image is right-aligned in its column, so anchor its label to the right too */
    .draw-item--small .draw-cap { left: auto; right: 0; justify-content: flex-end; text-align: right; }
    /* Start a fresh row at column 1 so it clears Layering's 168%-wide overflow.
       A Face is the same artwork size as Layering, so it gets the same 168% width
       (on sm it stacks below Layering — the pair is too wide to sit side by side). */
    .draw-item--below { grid-column: 1; }
    /* Layering of Personal Histories — wider than its column.
       max-width:none overrides Tailwind's base img { max-width:100% } cap. */
    .draw-item--reduce img,
    .draw-item--below img { width: 168%; max-width: none; }
    /* Consolation — sits across from Layering. Its 103% width makes its rendered
       height equal Layering's (Consolation is 1289×1600 portrait, Layering 168%
       wide landscape — the two heights match at this width ratio, at any scale).
       On sm it stacks in column 1 below Layering. */
    .draw-item--beside { grid-column: 1; }
    .draw-item--beside img { width: 103%; max-width: none; }
    /* Shelter — a wide 2:1 work that hangs between Layering and Consolation.
       On sm it stacks in column 1 with the rest. */
    .draw-item--center { grid-column: 1; }
    /* Primordial Ooze — the largest work; on sm it stacks in column 1. */
    .draw-item--ooze { grid-column: 1; }
    /* It sits below a short square, so its row leaves extra slack above it.
       Pull it up so the gap matches the rhythm of the rows above. */
    .draw-item--reduce { margin-top: -20px; }
  }
  @media (min-width: 1024px) {
    .draw-wall { grid-template-columns: repeat(4, 1fr); column-gap: 56px; row-gap: 88px; }
    .draw-row3 { margin-top: 88px; }
    .draw-row2 { margin-top: 88px; }
    /* Triptych: all three the height of Perfectionism (width = height × aspect,
       with H_perfectionism = 0.51475·wall − 57.2px, % of wall). The outer works
       are the same image (aspect 0.589); the middle is aspect 0.606.
       space-between pins the outer works to the field edges and centres the
       middle. */
    .draw-trip { flex-direction: row; justify-content: space-between; align-items: flex-start; margin-top: 88px; }
    .draw-trip .draw-item:first-child { width: calc(30.33% - 33.7px); }  /* untitled-a, 0.589 */
    .draw-trip .draw-item:nth-child(2) { width: calc(31.17% - 34.6px); } /* untitled-b, 0.606 */
    .draw-trip .draw-item:last-child { width: calc(30.93% - 34.4px); }   /* untitled-c, 0.601 */
    /* A Secret (left) matches Primordial Ooze's rendered HEIGHT (it is a
       narrower, taller work, so its width = 0.898 × Ooze's width). The Hearing /
       Shedding stack sits to its right, pinned to the field's right edge. */
    .draw-secret { margin-top: 88px; display: flex; align-items: center; }
    .draw-secret > .draw-item { width: calc(43.57% - 39.5px); }
    /* Perfectionism, sized responsively (started at 1.2 × Shadow's Hand, then
       +30%). Auto side margins centre it in the free space right of A Secret. */
    .draw-secret__stack { width: calc(41.18% - 45.76px); margin-top: 0; margin-left: auto; margin-right: auto; position: relative; left: 51px; }
    /* lift via margin (transform is used by the reveal animation) */
